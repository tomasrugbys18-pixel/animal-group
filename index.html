<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Entrenamiento - Animal Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0b0c10; color: #e2e8f0; padding: 20px; max-width: 900px; margin: 0 auto; padding-bottom: 120px; }
        .top-bar { height: 4px; background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899); border-radius: 2px; margin-bottom: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header-logo-container { display: flex; align-items: center; gap: 14px; }

        .badge { background: #3b82f6; color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; }
        h1 { font-size: 22px; font-weight: 900; text-transform: uppercase; margin-top: 2px; }
        
        /* Pantalla de Login con la imagen de fondo exacta que enviaste */
        #login-screen { 
            position: relative;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 75vh; 
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #232936;
            background-color: #0b0c10;
            background-image: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 40px 20px;
        }

        /* Capa oscura sutil para contraste */
        #login-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.45);
            z-index: 1;
        }

        .login-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }

        .animal-logo {
            width: min(520px, 92%);
            height: auto;
            display: block;
            object-fit: contain;
            margin: 0 auto 35px;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.45));
            transform-style: preserve-3d;
            transform-origin: center center;
            animation: logo3D 5s ease-in-out infinite;
            will-change: transform, filter;
        }

        @keyframes logo3D {
            0%, 100% {
                transform: perspective(900px) rotateY(-7deg) rotateX(2deg) translateY(0) scale(1);
                filter: drop-shadow(0 10px 25px rgba(0,0,0,0.45));
            }
            25% {
                transform: perspective(900px) rotateY(7deg) rotateX(-2deg) translateY(-5px) scale(1.015);
                filter: drop-shadow(10px 15px 30px rgba(70, 60, 180, 0.45));
            }
            50% {
                transform: perspective(900px) rotateY(0deg) rotateX(3deg) translateY(-8px) scale(1.025);
                filter: drop-shadow(0 18px 35px rgba(100, 70, 220, 0.55));
            }
            75% {
                transform: perspective(900px) rotateY(-7deg) rotateX(-2deg) translateY(-5px) scale(1.015);
                filter: drop-shadow(-10px 15px 30px rgba(70, 60, 180, 0.45));
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .animal-logo {
                animation: none;
            }
        }

        /* Botón "¿Estás listo para entrenar como un Animal?" */
        .btn-ready {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            border: none;
            padding: 18px 28px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 15px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 0.5px;
            width: 100%;
        }

        .btn-ready:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.6);
        }

        /* Tarjeta del formulario desplegable */
        .login-card { 
            display: none;
            background: rgba(21, 25, 35, 0.95); 
            backdrop-filter: blur(12px);
            border: 1px solid #2d3748; 
            border-radius: 14px; 
            padding: 30px 25px; 
            width: 100%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            text-align: center; 
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h2 { margin-bottom: 20px; font-size: 18px; text-transform: uppercase; color: #fff; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 5px; }
        .form-input { width: 100%; padding: 12px; background: #0f1219; border: 1px solid #232936; border-radius: 6px; color: #fff; font-size: 14px; }
        .form-input:focus { border-color: #3b82f6; outline: none; }
        .btn-login { width: 100%; padding: 12px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border: none; border-radius: 6px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 10px; font-size: 13px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        .btn-login:hover { opacity: 0.9; }
        
        .btn-back { background: transparent; border: none; color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        .btn-back:hover { color: #fff; }

        .error-msg { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; font-weight: 600; }

        /* Firma en el costado inferior */
        .signature {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 2;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Contenido de la rutina */
        #app-content { display: none; }

        .user-card { background: #151923; border: 1px solid #232936; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; align-items: center; }
        .user-card strong { color: #fff; }
        .alumno-title { font-size: 15px; color: #60a5fa; font-weight: 800; }
        .btn-logout { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; }

        .nav-tabs-wrapper { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
        .nav-tabs { display: flex; gap: 8px; overflow-x: auto; flex: 1; padding-bottom: 5px; }
        .tab-btn { padding: 10px 16px; background: #151923; border: 1px solid #232936; color: #64748b; font-weight: 800; font-size: 12px; border-radius: 6px; cursor: pointer; text-transform: uppercase; min-width: 120px; text-align: center; }
        .tab-btn.active { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border-color: #3b82f6; }

        .block { margin-bottom: 20px; border: 1px solid #232936; border-radius: 8px; overflow: hidden; background: #0f1219; }
        .block-header { background: #151923; border-left: 4px solid #3b82f6; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; text-transform: uppercase; }
        .block-tag { color: #60a5fa; font-size: 11px; }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: #181d2a; color: #94a3b8; font-size: 11px; text-transform: uppercase; padding: 10px; border-bottom: 1px solid #232936; }
        td { padding: 10px; border-bottom: 1px solid #1a202c; color: #cbd5e1; }
        tr:last-child td { border-bottom: none; }
        tr.completed { opacity: 0.5; text-decoration: line-through; }

        .badge-num { background: #3b82f6; color: #fff; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
        .checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #3b82f6; }
        .input-carga { background: #1a202c; border: 1px solid #2d3748; color: #fff; padding: 6px 8px; border-radius: 6px; width: 80px; text-align: center; font-size: 12px; font-weight: 600; }
        .input-carga:focus { border-color: #3b82f6; outline: none; }
        
        .btn-video { background: #2563eb; color: #fff; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-video:hover { background: #1d4ed8; }

        /* Barra de guardado flotante */
        .save-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #151923; border-top: 1px solid #232936; padding: 15px; display: flex; justify-content: center; align-items: center; gap: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.6); z-index: 1000; }
        .btn-save-all { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; border: none; padding: 12px 30px; border-radius: 8px; font-weight: 900; font-size: 14px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); }
        .btn-save-all:hover { opacity: 0.9; }
        .save-msg { font-size: 13px; font-weight: 700; color: #22c55e; display: none; }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <header>
        <div class="header-logo-container">
            <div>
                <span class="badge">ANIMAL GROUP SYSTEM</span>
                <h1>Plan Semanal</h1>
            </div>
        </div>
        <div style="text-align: right;">
            <strong style="color: #3b82f6;">ELITE COACHING</strong>
        </div>
    </header>

        <div class="user-card">
            <div>ALUMNO/A: <span id="nombre-alumno" class="alumno-title">Atleta</span></div>
            <div><button class="btn-logout" onclick="logout()">Cerrar Sesión</button></div>
        </div>

        <div class="nav-tabs-wrapper">
            <div class="nav-tabs" id="tabs-container"></div>
        </div>

        <div id="blocks-container"></div>

        <!-- BARRA INFERIOR DE GUARDADO MANUAL -->
        <div class="save-bar">
            <button class="btn-save-all" onclick="guardarTodoElHistorial()">💾 Guardar Mis Pesos</button>
            <span id="saveMsg" class="save-msg">¡Pesos guardados con éxito! ✓</span>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxh_luXYebzeU47HYkkPKAFQME9EY2vidblkCXHDgisAJ6gK-aulwV8TMcEkwl_T0K1oA/exec";

        let allData = [];
        let routineDays = {};
        let activeDay = "";
        let currentUser = "";

        function mostrarLogin() {
            document.getElementById('btnReady').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
        }

        function ocultarLogin() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('btnReady').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }

        async function login() {
            currentUser = document.getElementById('userInput').value.trim().toLowerCase();
            const passVal = document.getElementById('passInput').value.trim();
            const errorDiv = document.getElementById('errorMsg');

            if (!currentUser || !passVal) {
                errorDiv.innerText = "Por favor completa ambos campos.";
                errorDiv.style.display = "block";
                return;
            }

            errorDiv.style.display = "none";

            try {
                const response = await fetch(WEB_APP_URL);
                allData = await response.json();

                const userRows = allData.filter(row => 
                    String(row.usuario).trim().toLowerCase() === currentUser && 
                    String(row.codigo).trim() === passVal
                );

                if (userRows.length === 0) {
                    errorDiv.innerText = "Usuario o código incorrectos.";
                    errorDiv.style.display = "block";
                    return;
                }

                let alumnoNombre = userRows[0].alumno || currentUser;
                document.getElementById('nombre-alumno').innerText = alumnoNombre;

                routineDays = {};
                userRows.forEach(row => {
                    let dia = row.dia || "Día 1";
                    let bloque = row.bloque || "Bloque 1";
                    let tag = row.tag || "";
                    
                    if (!routineDays[dia]) routineDays[dia] = {};
                    if (!routineDays[dia][bloque]) routineDays[dia][bloque] = { tag: tag, exercises: [] };
                    
                    routineDays[dia][bloque].exercises.push({
                        name: row.ejercicio,
                        series: row.series,
                        reps: row.reps,
                        carga: row.carga || "",
                        video: row.video
                    });
                });

                const daysList = Object.keys(routineDays);
                if (daysList.length > 0) {
                    activeDay = daysList[0];
                }

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                render();

            } catch (error) {
                errorDiv.innerText = "Error de conexión con Google Sheets.";
                errorDiv.style.display = "block";
            }
        }

        async function guardarTodoElHistorial() {
            const inputs = document.querySelectorAll('.input-carga');
            const saveMsg = document.getElementById('saveMsg');
            
            let cargasData = [];
            inputs.forEach(input => {
                cargasData.push({
                    ejercicio: input.getAttribute('data-ejercicio'),
                    carga: input.value || "Sin carga"
                });
            });

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        usuario: currentUser, 
                        registros: cargasData 
                    })
                });

                saveMsg.style.display = "inline";
                setTimeout(() => {
                    saveMsg.style.display = "none";
                }, 3000);
            } catch (err) {
                console.error("Error al registrar historial", err);
                alert("Hubo un error al guardar. Revisa tu conexión.");
            }
        }

        function logout() {
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            ocultarLogin();
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
            routineDays = {};
            activeDay = "";
            currentUser = "";
        }

        function render() {
            const daysList = Object.keys(routineDays);
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            
            daysList.forEach(day => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${day === activeDay ? 'active' : ''}`;
                btn.innerText = day;
                btn.onclick = () => { activeDay = day; render(); };
                tabsContainer.appendChild(btn);
            });

            const blocksContainer = document.getElementById('blocks-container');
            blocksContainer.innerHTML = '';

            if (activeDay && routineDays[activeDay]) {
                const blocks = routineDays[activeDay];
                Object.keys(blocks).forEach(blockName => {
                    const blockData = blocks[blockName];
                    const blockDiv = document.createElement('div');
                    blockDiv.className = 'block';
                    
                    let rowsHtml = '';
                    blockData.exercises.forEach((ex, idx) => {
                        let safeName = String(ex.name).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                        
                        rowsHtml += `
                            <tr>
                                <td style="text-align: center;"><input type="checkbox" class="checkbox" onclick="toggleRow(this)"></td>
                                <td>
                                    <span class="badge-num">${idx + 1}</span> 
                                    <span>${ex.name}</span>
                                </td>
                                <td style="text-align: center;">${ex.series}</td>
                                <td style="text-align: center;">${ex.reps}</td>
                                <td style="text-align: center;"><input type="text" class="input-carga" value="${ex.carga}" data-ejercicio="${safeName}" placeholder="Kg"></td>
                                <td style="text-align: center;"><a href="${ex.video}" target="_blank" class="btn-video">▶ Ver</a></td>
                            </tr>
                        `;
                    });

                    blockDiv.innerHTML = `
                        <div class="block-header">
                            <span>${blockName}</span>
                            <span class="block-tag">${blockData.tag}</span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 40px; text-align: center;">✓</th>
                                    <th>Ejercicio</th>
                                    <th style="text-align: center;">Series</th>
                                    <th style="text-align: center;">Reps</th>
                                    <th style="text-align: center;">Carga</th>
                                    <th style="text-align: center;">Vídeo</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    `;
                    blocksContainer.appendChild(blockDiv);
                });
            }
        }

        function toggleRow(checkbox) { 
            checkbox.closest('tr').classList.toggle('completed', checkbox.checked); 
        }
    </script>
</body>
</html>
